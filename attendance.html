<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Management App</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f5f9;
  color:#222;
}

header{
  background:#17365d;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0 0 6px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  border:none;
  background:#17365d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.box{
  padding:15px;
  text-align:center;
  border-radius:10px;
  background:#eef3f8;
}

.box strong{
  display:block;
  font-size:24px;
  margin-top:5px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  padding:10px;
  border:1px solid #ddd;
  text-align:center;
}

th{
  background:#17365d;
  color:white;
}

.edit{
  background:#e67e22;
}

.delete{
  background:#c0392b;
}

.back{
  background:#555;
}

@media(max-width:600px){
  .summary{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>Attendance Management</h1>
  <div>Employee Attendance Demo App</div>
</header>

<div class="container">

  <div class="card">

    <h2>Mark Attendance</h2>

    <label>Employee Name</label>
    <input type="text" id="employeeName" placeholder="Enter employee name">

    <label>Date</label>
    <input type="date" id="date">

    <label>Attendance</label>
    <select id="attendance">
      <option value="Present">Present</option>
      <option value="Absent">Absent</option>
      <option value="Half Day">Half Day</option>
      <option value="Leave">Leave</option>
    </select>

    <label>Duty Hours</label>
    <select id="hours">
      <option value="8">8 Hours</option>
      <option value="10">10 Hours</option>
      <option value="12">12 Hours</option>
      <option value="24">24 Hours</option>
    </select>

    <button onclick="saveAttendance()">Save Attendance</button>

  </div>

  <div class="card">

    <h2>Attendance Summary</h2>

    <div class="summary">

      <div class="box">
        Present
        <strong id="presentCount">0</strong>
      </div>

      <div class="box">
        Absent
        <strong id="absentCount">0</strong>
      </div>

      <div class="box">
        Half Day
        <strong id="halfCount">0</strong>
      </div>

      <div class="box">
        Leave
        <strong id="leaveCount">0</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <h2>Attendance Records</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Employee</th>
            <th>Date</th>
            <th>Status</th>
            <th>Hours</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="attendanceTable"></tbody>

      </table>

    </div>

  </div>

  <div class="card">

    <button class="back" onclick="goBack()">← Back to Portfolio</button>

  </div>

</div>

<script>

let records = JSON.parse(localStorage.getItem("attendanceRecords")) || [];

let editIndex = -1;

document.getElementById("date").value =
  new Date().toISOString().split("T")[0];

function saveAttendance(){

  let name =
    document.getElementById("employeeName").value.trim();

  let date =
    document.getElementById("date").value;

  let status =
    document.getElementById("attendance").value;

  let hours =
    document.getElementById("hours").value;

  if(name === "" || date === ""){
    alert("Please enter Employee Name and Date");
    return;
  }

  let record = {
    name:name,
    date:date,
    status:status,
    hours:hours
  };

  if(editIndex === -1){

    records.push(record);

  }else{

    records[editIndex] = record;
    editIndex = -1;

  }

  localStorage.setItem(
    "attendanceRecords",
    JSON.stringify(records)
  );

  clearForm();
  displayRecords();

  alert("Attendance Saved Successfully");

}

function displayRecords(){

  let table =
    document.getElementById("attendanceTable");

  table.innerHTML = "";

  records.forEach((record,index)=>{

    table.innerHTML += `
      <tr>

        <td>${record.name}</td>

        <td>${record.date}</td>

        <td>${record.status}</td>

        <td>${record.hours}</td>

        <td>

          <button class="edit"
            onclick="editRecord(${index})">
            Edit
          </button>

          <button class="delete"
            onclick="deleteRecord(${index})">
            Delete
          </button>

        </td>

      </tr>
    `;

  });

  updateSummary();

}

function updateSummary(){

  let present = 0;
  let absent = 0;
  let half = 0;
  let leave = 0;

  records.forEach(record=>{

    if(record.status === "Present") present++;

    if(record.status === "Absent") absent++;

    if(record.status === "Half Day") half++;

    if(record.status === "Leave") leave++;

  });

  document.getElementById("presentCount").textContent = present;

  document.getElementById("absentCount").textContent = absent;

  document.getElementById("halfCount").textContent = half;

  document.getElementById("leaveCount").textContent = leave;

}

function editRecord(index){

  let record = records[index];

  document.getElementById("employeeName").value =
    record.name;

  document.getElementById("date").value =
    record.date;

  document.getElementById("attendance").value =
    record.status;

  document.getElementById("hours").value =
    record.hours;

  editIndex = index;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function deleteRecord(index){

  if(confirm("Delete this attendance record?")){

    records.splice(index,1);

    localStorage.setItem(
      "attendanceRecords",
      JSON.stringify(records)
    );

    displayRecords();

  }

}

function clearForm(){

  document.getElementById("employeeName").value = "";

  document.getElementById("attendance").value =
    "Present";

  document.getElementById("hours").value =
    "8";

  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

}

function goBack(){

  window.location.href = "index.html";

}

displayRecords();

</script>

</body>
</html>
